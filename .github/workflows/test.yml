name: Test

on:
  pull_request:

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install and test
        run: npm ci && npm test
        env:
          CYPRESS_INSTALL_BINARY: 0
